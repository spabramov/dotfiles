# Make Homebrew tools available to run-shell/tpack bindings inside tmux
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# term colors, these are the correct ones according to neovim checkhealth
# set-option -g default-terminal "screen-256color"
set -g default-terminal "$TERM"
set -sg terminal-overrides ",$TERM:Tc"

# for neovim
set -sg escape-time 0
set -g mouse on
set-option -g focus-events on
## ctrl-arrows passthrough
set -g xterm-keys on
bind -n C-Left  send-keys "\e[1;5D"
bind -n C-Right send-keys "\e[1;5C"
bind -n C-Up    send-keys "\e[1;5A"
bind -n C-Down  send-keys "\e[1;5B"

set -g extended-keys on
set -g extended-keys-format csi-u

# for images to work
set -g allow-passthrough on

## from omerxx
# set -g prefix ^A
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
# set -g pane-active-border-style 'fg=magenta,bg=default'
# set -g pane-border-style 'fg=brightblack,bg=default'

## count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Set the current working directory based on the current pane's current
# working directory (if set; if not, use the pane's starting directory)
# when creating # new windows and splits.
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# List of plugins
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ## evergreen tmux
set -g status-style 'bg=default fg=white'
set -g status-left '#[bold] #S '
set -g status-right ''
set -g status-right-length 50
set -g status-left-length 20
# setw -g window-status-current-style 'fg=#3D484D bg=default bold'
setw -g window-status-current-format '#[fg=#475258,bg=#A7C080] #I#[fg=#475258,bg=#A7C080]:#[fg=#3D484D,bg=#A7C080]#W#[fg=#56635f,bg=#A7C080]#F '
# setw -g window-status-style 'fg=white bg=#475259'
setw -g window-status-format ' #I#[fg=white]:#[fg=white]#W#[fg=white]#F '

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/opt/homebrew/bin/tpack init'

